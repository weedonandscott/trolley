[package]
name = "trolley"
version = "0.10.0"
edition = "2024"

[dependencies]
trolley-config = { path = "../config", features = ["cli"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.18"
console = "0.16"
xshell = "0.2"
walkdir = "2"
directories = "6"
dotenvy = "0.15"
toml = "1.1"
url = "2"
ureq = "3"
tar = "0.4"
# static: link the bundled liblzma instead of whatever pkg-config finds —
# on the mac runners that was homebrew's dylib, which end-user machines lack
xz2 = { version = "0.1", features = ["static"] }
ttf-parser = "0.25"
flate2 = "1"
rpm = { version = "0.25", default-features = false, features = ["payload", "gzip-compression"] }
png = "0.18"
# 0.3.2 floor, measured: 0.3.0 and 0.3.1 match nothing under a `\\?\C:\` root,
# which is what canonicalize returns on Windows, so icon globs silently fail.
glob = "0.3.2"
cargo-packager = { version = "0.11.8", default-features = false, features = ["rustls-tls"] }


[dev-dependencies]
insta = "1"
tempfile = "3"
